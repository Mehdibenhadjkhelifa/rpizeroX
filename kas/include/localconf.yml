header:
  version: 15
local_conf_header:
  custom-settings: |
    PATCHRESOLVE = "noop"
    CONF_VERSION = "2"
    DL_DIR = "/yoctoshare/downloads"
    SSTATE_DIR = "/yoctoshare/sstate-cache"
    BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"
    ENABLE_UART = "1"
    INHERIT += "buildhistory"
    BUILDHISTORY_COMMIT = "1"
    IMAGE_FEATURES:append = " empty-root-password"
